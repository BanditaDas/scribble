<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="scribble-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="32" height="32" rx="7.5" fill="#14151F" />
  <rect x="0.5" y="0.5" width="31" height="31" rx="7" fill="none" stroke="#2D3045" stroke-width="1" />

  <!-- Flowing Scribble 'S' Stroke -->
  <path
    d="M 23 9 C 16 6 9 9.5 10 13.5 C 11 17.5 21 14.5 22 18.5 C 23 22.5 15 25.5 8 23"
    fill="none"
    stroke="url(#scribble-gradient)"
    stroke-width="2.75"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Subtle Accent Dot -->
  <circle cx="23.5" cy="8.5" r="1.25" fill="#C7D2FE" />
</svg>
